name: Feature Request
description: Suggest an improvement to Action Inspector
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Suggested solution
      description: How would you like Action Inspector to address the problem?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Are there other approaches worth considering?